[workspace]
resolver = "3"
members = [
    "crates/nu_plugin_soak",
]

[workspace.package]
authors         = ["SourceTrait <development@sourcetrait.com"]
license         = "AGPL-3.0-or-later"
version         = "0.115.1"
edition         = "2024"
rust-version    = "1.95.0"
repository      = "https://github.com/sourcetrait/nu_plugins"
homepage        = "https://sourcetrait.com"
keywords        = ["nu", "nushell", "plugin"]
categories      = []

[workspace.dependencies]
dir_walker  = "0.1"
liquid      = "0.26"
humantime   = "2"
snafu       = "0.9"
tempfile    = "3"

sourcetrait_tooling = "0.0.0-2"

nu-plugin               = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-plugin-engine        = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-plugin-test-support  = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-protocol             = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-glob                 = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-ansi-term            = "0.50.3"

[profile.release]
opt-level   = "s"
strip       = "debuginfo"
lto         = "thin"
